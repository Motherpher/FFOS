name: Household Family Security
on:
  pull_request:
    paths:
      [
        "modules/household-family/**",
        ".github/workflows/household-family-*.yml",
      ]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modules/household-family
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.22.1" }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm audit --audit-level=high --json > audit.json
      - name: Security and governance regression
        run: npm test -- tests/security.test.ts tests/governance.test.ts tests/recovery.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: household-family-security-evidence
          path: modules/household-family/audit.json
          retention-days: 30

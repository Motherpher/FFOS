name: FFOS cloud API — Kolada municipality
on:
  workflow_dispatch:
    inputs:
      municipality_id:
        description: 'Four-digit Kolada municipality identifier (e.g. 0380)'
        type: string
        required: true
        default: '0380'
      persist_to_drive:
        description: 'Upload verified files to approved Google Drive folder (requires OAuth secrets)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ffos-kolada-${{ github.ref }}-${{ inputs.municipality_id }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline contract tests
        run: |
          python -m unittest discover -s tests -p 'test_cloud_kolada_lookup.py' -v
          python -m unittest discover -s tests -p 'test_cloud_drive_storage.py' -v
  lookup:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloud-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live public Kolada API request
        env:
          MUNICIPALITY_ID: ${{ inputs.municipality_id }}
        run: |
          python integrations/cloud/kolada_lookup.py --municipality-id "$MUNICIPALITY_ID" --output-dir "$RUNNER_TEMP/ffos-kolada"
      - uses: actions/upload-artifact@v4
        with:
          name: ffos-kolada-${{ inputs.municipality_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ffos-kolada/
          if-no-files-found: error
          retention-days: 14

  drive-publish:
    needs: lookup
    if: ${{ inputs.persist_to_drive }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: drive-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ffos-kolada-${{ inputs.municipality_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ffos-drive-upload
      - name: Publish verified Kolada artifacts to approved Google Drive
        env:
          FFOS_GDRIVE_CLIENT_ID: ${{ secrets.FFOS_GDRIVE_CLIENT_ID }}
          FFOS_GDRIVE_CLIENT_SECRET: ${{ secrets.FFOS_GDRIVE_CLIENT_SECRET }}
          FFOS_GDRIVE_REFRESH_TOKEN: ${{ secrets.FFOS_GDRIVE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ vars.FFOS_GDRIVE_ROOT_FOLDER_ID || '1xO4YWl4yQmyRJ6t-A_4j9vaVDkiBhArD' }}
        run: |
          python integrations/cloud/drive_oauth_preflight.py \
            --root-folder-id "$DRIVE_FOLDER_ID" \
            --receipt "$RUNNER_TEMP/drive-oauth-preflight.json"
          python integrations/cloud/drive_storage.py \
            --source-dir "$RUNNER_TEMP/ffos-drive-upload" \
            --root-folder-id "$DRIVE_FOLDER_ID" \
            --namespace FFOS \
            --run-id "kolada_${{ inputs.municipality_id }}_${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ffos-drive-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/drive-oauth-preflight.json
            ${{ runner.temp }}/ffos-drive-upload/drive-receipt.json
          if-no-files-found: error
          retention-days: 14

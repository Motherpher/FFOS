name: FFOS cloud API — Kolada municipality
on:
  workflow_dispatch:
    inputs:
      municipality_id:
        description: 'Four-digit Kolada municipality identifier (e.g. 0380)'
        type: string
        required: true
        default: '0380'
permissions:
  contents: read
concurrency:
  group: ffos-kolada-${{ github.ref }}-${{ inputs.municipality_id }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline contract tests
        run: python -m unittest discover -s tests -p 'test_cloud_kolada_lookup.py' -v
  lookup:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloud-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live public Kolada API request
        env:
          MUNICIPALITY_ID: ${{ inputs.municipality_id }}
        run: |
          python integrations/cloud/kolada_lookup.py --municipality-id "$MUNICIPALITY_ID" --output-dir "$RUNNER_TEMP/ffos-kolada"
      - uses: actions/upload-artifact@v4
        with:
          name: ffos-kolada-${{ inputs.municipality_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ffos-kolada/
          if-no-files-found: error
          retention-days: 14

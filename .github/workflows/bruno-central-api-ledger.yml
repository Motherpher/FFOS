name: Bruno Central API Ledger static QA

on:
  pull_request:
    paths:
      - 'integrations/bruno/**'
      - '.github/workflows/bruno-central-api-ledger.yml'
  push:
    paths:
      - 'integrations/bruno/**'
      - '.github/workflows/bruno-central-api-ledger.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenCollection requests offline
        run: python3 integrations/bruno/validate_collection.py
      - name: Verify non-secret archive inventory (static only)
        run: python3 integrations/bruno/archive_inventory.py --output /tmp/bruno-inventory.json

      - name: Validate archive inventory implementation and negative security tests
        run: |
          python3 -m py_compile integrations/bruno/archive_inventory.py
          python3 -m unittest integrations/bruno/test_archive_inventory.py -v
          python3 integrations/bruno/archive_inventory.py --output /tmp/bruno-approved-inventory.json

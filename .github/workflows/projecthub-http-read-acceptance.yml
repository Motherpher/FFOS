name: ProjectHub authenticated HTTP read acceptance
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'modules/projecthub/**'
      - 'packages/projecthub-model/**'
      - 'scripts/projecthub-http-read-acceptance.mjs'
      - 'scripts/projecthub-http-local-seed.mjs'
      - 'scripts/projecthub-verify-supabase-tls.sh'
      - '.github/workflows/projecthub-http-read-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: projecthub-http-read-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: projecthub_http_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install FFOS app packages
        run: npm install --prefix apps/web --no-audit --no-fund
      - name: Syntax check HTTP read test
        run: node --check scripts/projecthub-http-read-acceptance.mjs
      - name: Compile actual Next.js FFOS application
        run: npm run build --prefix apps/web
      - name: Seed CI-only Postgres projects, RLS and login
        env:
          PROJECTHUB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projecthub_http_test
        run: node scripts/projecthub-http-local-seed.mjs
      - name: Verify full authenticated Next.js HTTP read against synthetic PostgreSQL projects
        env:
          FFOS_PROJECTHUB_DATABASE_URL: postgresql://ffos_wp02_test_login:ci-local-only@localhost:5432/projecthub_http_test
          FFOS_PROJECTHUB_READS_ENABLED: 'true'
          FFOS_PROJECTHUB_WRITES_ENABLED: 'false'
          FFOS_PROJECTHUB_AUTHORITY_REF: FFOS-AUTH-PHASE0-DIRECTOR
          FFOS_PROJECTHUB_MANDATE_REF: FFOS-DEVOPS-PH-RECON-001
          FFOS_DIRECTOR_USER: FFOS:WP02_TEST_DIRECTOR
          FFOS_WP02_LOCAL_FIXTURE_ID: WP02-FIXTURE-ALPHA
        run: |
          set -euo pipefail
          export FFOS_DIRECTOR_PASSWORD="$(openssl rand -hex 32)"
          export FFOS_SESSION_SECRET="$(openssl rand -hex 48)"
          npm run start --prefix apps/web -- -p 31981 >"$RUNNER_TEMP/ffos-local-http.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          node scripts/projecthub-http-read-acceptance.mjs
  protected-live-http-canary:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: projecthub-read-canary
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      FFOS_PROJECTHUB_READ_DATABASE_URL: ${{ secrets.FFOS_PROJECTHUB_READ_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and build FFOS production application
        run: |
          npm install --prefix apps/web --no-audit --no-fund
          npm run build --prefix apps/web
      - name: Verify Supabase CA and test authenticated Next.js HTTP over live restricted database
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bash scripts/projecthub-verify-supabase-tls.sh "$RUNNER_TEMP/supabase-root-ca.pem"
          export NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/supabase-root-ca.pem"
          export FFOS_PROJECTHUB_DATABASE_URL="$FFOS_PROJECTHUB_READ_DATABASE_URL"
          export FFOS_PROJECTHUB_READS_ENABLED=true
          export FFOS_PROJECTHUB_WRITES_ENABLED=false
          export FFOS_PROJECTHUB_AUTHORITY_REF=FFOS-AUTH-PHASE0-DIRECTOR
          export FFOS_PROJECTHUB_MANDATE_REF=FFOS-DEVOPS-PH-RECON-001
          export FFOS_DIRECTOR_USER=FFOS:WP02_TEST_DIRECTOR
          export FFOS_DIRECTOR_PASSWORD="$(openssl rand -hex 32)"
          export FFOS_SESSION_SECRET="$(openssl rand -hex 48)"
          npm run start --prefix apps/web -- -p 31981 >"$RUNNER_TEMP/ffos-wp02-http-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/projecthub-http-read-acceptance.mjs

name: ProjectHub DevOps

on:
  pull_request:
    paths:
      - 'modules/projecthub/**'
      - 'packages/projecthub-model/**'
      - 'packages/registry/migrations/*projecthub*.sql'
      - 'integrations/projecthub/**'
      - 'integrations/cdx/projecthub-runtime.ts'
      - 'apps/web/lib/projecthub/**'
      - 'apps/web/app/(protected)/projecthub/**'
      - 'apps/web/app/api/projecthub/**'
      - 'docs/operations/devops/processes/projecthub-production/**'
      - 'scripts/projecthub_l3_assurance.py'
      - '.github/workflows/projecthub-production-write-canary.yml'
      - 'docs/specifications/PROJECTHUB-**'
      - 'docs/architecture/PROJECTHUB-**'
      - '.github/workflows/projecthub-devops.yml'
  push:
    branches: [main]
    paths:
      - 'modules/projecthub/**'
      - 'packages/projecthub-model/**'
      - 'packages/registry/migrations/*projecthub*.sql'
      - 'docs/specifications/PROJECTHUB-**'
      - 'docs/architecture/PROJECTHUB-**'
      - 'integrations/projecthub/**'
      - 'integrations/cdx/projecthub-runtime.ts'
      - 'apps/web/lib/projecthub/**'
      - 'apps/web/app/(protected)/projecthub/**'
      - 'apps/web/app/api/projecthub/**'
      - 'scripts/projecthub_l3_assurance.py'
      - '.github/workflows/projecthub-devops.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: present
        name: Detect ProjectHub implementation
        shell: bash
        run: |
          if [ -f modules/projecthub/package.json ]; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo "value=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install ProjectHub runtime dependency
        if: steps.present.outputs.value == 'true'
        run: npm install --prefix modules/projecthub --no-audit --no-fund
      - name: ProjectHub core and rights tests
        if: steps.present.outputs.value == 'true'
        run: npm test --prefix modules/projecthub
      - name: Check production canary syntax
        if: steps.present.outputs.value == 'true'
        run: |
          node --check modules/projecthub/read-canary.mjs
          node --check modules/projecthub/write-canary.ts

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projecthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECTHUB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projecthub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: present
        name: Detect ProjectHub implementation
        shell: bash
        run: |
          if [ -f modules/projecthub/package.json ]; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo "value=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install ProjectHub runtime dependency
        if: steps.present.outputs.value == 'true'
        run: npm install --prefix modules/projecthub --no-audit --no-fund
      - name: ProjectHub PostgreSQL transaction test (serialized schema setup)
        if: steps.present.outputs.value == 'true'
        working-directory: modules/projecthub
        run: node --import tsx --test --test-concurrency=1 tests/*.test.ts

  l3-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ProjectHub L3 release static assurance
        run: python scripts/projecthub_l3_assurance.py

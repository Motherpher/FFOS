name: ProjectHub DevOps

on:
  pull_request:
    paths:
      - 'modules/projecthub/**'
      - 'packages/projecthub-model/**'
      - 'docs/specifications/PROJECTHUB-**'
      - 'docs/architecture/PROJECTHUB-**'
      - '.github/workflows/projecthub-devops.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install ProjectHub runtime dependency
        run: npm install --prefix modules/projecthub --no-audit --no-fund
      - name: ProjectHub core and rights tests
        run: npm test --prefix modules/projecthub

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projecthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECTHUB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projecthub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install ProjectHub runtime dependency
        run: npm install --prefix modules/projecthub --no-audit --no-fund
      - name: ProjectHub PostgreSQL transaction test
        run: node --test modules/projecthub/tests/postgres.test.ts

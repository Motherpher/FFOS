name: Agent Stable Suite

on:
  pull_request:
    paths:
      - "agent-stable/**"
      - "docs/architecture/AGENT-STABLE.md"
      - "docs/architecture/AMA.md"
      - "docs/specifications/AGENT-MECHANIC.md"
      - "modules/household-family/**"
      - ".github/workflows/agent-stable-suite.yml"
  push:
    branches: [main]
    paths:
      - "agent-stable/**"
      - "docs/architecture/AGENT-STABLE.md"
      - "docs/architecture/AMA.md"
      - "docs/specifications/AGENT-MECHANIC.md"
      - "modules/household-family/**"

jobs:
  fleet-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python agent-stable/tests/test_stable_suite.py
      - run: pip install -r packages/agent-model/conformance/requirements.txt
      - run: python packages/agent-model/conformance/ama_conformance.py --manifest agent-stable/agents/01-messi/manifest-candidate-v0.1.json --bindings agent-stable/agents/01-messi/bindings-candidate-v0.1.json
      - run: python packages/agent-model/conformance/ama_conformance.py --manifest agent-stable/agents/02-household-family/manifest-candidate-v0.1.json --bindings agent-stable/agents/02-household-family/bindings-candidate-v0.1.json
  household-candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/household-family
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: modules/household-family/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check

name: FFOS data asset reuse contract tests
on:
  pull_request:
    paths:
      - 'packages/registry/src/data-assets.ts'
      - 'packages/registry/tests/data-assets.test.ts'
      - 'packages/registry/tests/data-assets-store.test.ts'
      - 'packages/registry/src/data-assets-store.ts'
      - 'packages/registry/migrations/0006_data_asset_workorders.sql'
      - '.github/workflows/data-assets-ci.yml'
  push:
    paths:
      - 'packages/registry/src/data-assets.ts'
      - 'packages/registry/tests/data-assets.test.ts'
      - 'packages/registry/tests/data-assets-store.test.ts'
      - 'packages/registry/src/data-assets-store.ts'
      - 'packages/registry/migrations/0006_data_asset_workorders.sql'
      - '.github/workflows/data-assets-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure reuse contract checks (no external APIs/database)
        run: node --experimental-strip-types --test packages/registry/tests/data-assets.test.ts packages/registry/tests/data-assets-store.test.ts

name: Supabase ProjectHub admission contract
on:
  pull_request:
    paths:
      - 'packages/registry/migrations/0008_projecthub.sql'
      - 'scripts/verify-projecthub-supabase-admission.mjs'
      - '.github/workflows/projecthub-supabase-admission.yml'
  push:
    branches: [main]
    paths:
      - 'packages/registry/migrations/0008_projecthub.sql'
      - 'scripts/verify-projecthub-supabase-admission.mjs'
      - '.github/workflows/projecthub-supabase-admission.yml'
permissions:
  contents: read
jobs:
  static-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-projecthub-supabase-admission.mjs

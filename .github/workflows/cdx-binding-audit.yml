name: CDX Binding Audit

on:
  push:
    paths:
      - '.cdx/**'
      - '.github/workflows/cdx-binding-audit.yml'
      - 'integrations/cdx/**'
  pull_request:
    paths:
      - '.cdx/**'
      - '.github/workflows/cdx-binding-audit.yml'
      - 'integrations/cdx/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical CDX anchor
        run: python3 .cdx/validate_anchor.py

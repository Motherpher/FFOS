name: CDX Binding Audit

on:
  push:
    paths:
      - '.cdx/**'
      - '.github/workflows/cdx-binding-audit.yml'
      - 'integrations/cdx/**'
  pull_request:
    paths:
      - '.cdx/**'
      - '.github/workflows/cdx-binding-audit.yml'
      - 'integrations/cdx/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical CDX anchor
        shell: bash
        run: |
          set -euo pipefail
          test -f .cdx/anchor.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .schema == "cdx.anchor/v1" and
            .system_short_name == "CDX" and
            .law_id == "CDX-LAW-001" and
            .cdx_authority.repository == "Hybrismannen/Conductellence-" and
            .cdx_authority.canonical_name == "Conductellence" and
            .cdx_authority.short_name == "CDX" and
            (.governed_surface.repository | ascii_downcase) == ($repo | ascii_downcase) and
            (.binding_mode == "PINNED_COMMIT" or .binding_mode == "PINNED_RELEASE" or .binding_mode == "TRACKING") and
            .local_enforcement.fail_closed_for_consequential_effects == true
          ' .cdx/anchor.json
          echo "PASS: FFOS canonical CDX anchor structure is valid."

name: CEX Binding Audit

on:
  push:
    paths:
      - '.cex/**'
      - '.github/workflows/cex-binding-audit.yml'
      - 'integrations/cex/**'
  pull_request:
    paths:
      - '.cex/**'
      - '.github/workflows/cex-binding-audit.yml'
      - 'integrations/cex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical CEX anchor
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          path = Path('.cex/anchor.json')
          if not path.exists():
              raise SystemExit('FAIL: .cex/anchor.json missing')

          doc = json.loads(path.read_text())

          expected = {
              'schema': 'cex.anchor/v1',
              'system_short_name': 'CEX',
              'law_id': 'CDX-LAW-001',
          }
          for key, value in expected.items():
              if doc.get(key) != value:
                  raise SystemExit(f'FAIL: {key}={doc.get(key)!r}, expected {value!r}')

          authority = doc.get('cex_authority', {})
          if authority.get('repository') != 'Hybrismannen/Conductellence-':
              raise SystemExit('FAIL: unknown CEX authority repository')
          if authority.get('canonical_name') != 'Conductellence':
              raise SystemExit('FAIL: canonical CEX name mismatch')
          if authority.get('short_name') != 'CEX':
              raise SystemExit('FAIL: canonical short name mismatch')

          governed = doc.get('governed_surface', {})
          repo = os.getenv('GITHUB_REPOSITORY')
          if governed.get('repository') != repo:
              raise SystemExit(f'FAIL: anchor repository {governed.get("repository")!r} != {repo!r}')

          mode = doc.get('binding_mode')
          pin = doc.get('policy_pin', {})
          if mode == 'PINNED_COMMIT':
              if pin.get('ref_type') != 'COMMIT':
                  raise SystemExit('FAIL: PINNED_COMMIT requires COMMIT ref_type')
              if not re.fullmatch(r'[0-9a-fA-F]{40}', str(pin.get('ref', ''))):
                  raise SystemExit('FAIL: pinned CEX commit must be a full 40-character SHA')

          if doc.get('binding_state') not in {
              'ANCHOR_DECLARED', 'CEX_BOUND', 'CEX_CI_MONITORED',
              'CEX_RUNTIME_GUARDED', 'CEX_RUNTIME_VERIFIED',
              'CEX_DEGRADED', 'CEX_REVOKED'
          }:
              raise SystemExit('FAIL: invalid CEX binding state')

          enforcement = doc.get('local_enforcement', {})
          if enforcement.get('fail_closed_for_consequential_effects') is not True:
              raise SystemExit('FAIL: consequential effects must fail closed')

          print(
              'PASS: FFOS CEX anchor -> '
              f'{authority["repository"]} ref={pin.get("ref")} state={doc.get("binding_state")}'
          )

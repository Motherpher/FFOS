name: ProjectHub production read-only canary
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ffos-projecthub-read-canary
  cancel-in-progress: false
jobs:
  read-only-acceptance:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: projecthub-read-canary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install ProjectHub dependencies
        run: npm install --prefix modules/projecthub --no-audit --no-fund
      - name: Verify public Supabase CA and pooler TLS before using credentials
        run: bash scripts/projecthub-verify-supabase-tls.sh "$RUNNER_TEMP/supabase-root-ca.pem"
      - name: Verify restricted Supabase login and read-only scope
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/supabase-root-ca.pem
          FFOS_PROJECTHUB_READ_DATABASE_URL: ${{ secrets.FFOS_PROJECTHUB_READ_DATABASE_URL }}
        run: node modules/projecthub/read-canary.mjs

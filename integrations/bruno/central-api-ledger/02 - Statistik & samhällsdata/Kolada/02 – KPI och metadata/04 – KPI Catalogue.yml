info:
  name: 04 – KPI Catalogue
  type: http
  seq: 2

http:
  method: GET
  url: "{{kolada_base_url}}/kpi"
  params:
    - name: title
      value: ""
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: per_page
      value: "100"
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        const ids = response.values
          .filter(item => item.has_ou_data === true)
          .map(item => item.id);

        console.log(ids);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

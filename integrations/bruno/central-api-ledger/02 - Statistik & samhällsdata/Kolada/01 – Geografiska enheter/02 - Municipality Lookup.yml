info:
  name: 02 - Municipality Lookup
  type: http
  seq: 2

http:
  method: GET
  url: "{{kolada_base_url}}/municipality/{{municipality_id}}?page=1&per_page=100"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: 01 – All Municipalities & Regions
  type: http
  seq: 1

http:
  method: GET
  url: "{{kolada_base_url}}/municipality?region_type=municipality&title=&page=1&per_page=100"
  params:
    - name: region_type
      value: municipality
      type: query
    - name: region_type
      value: region
      type: query
      disabled: true
    - name: title
      value: ""
      type: query
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: " 12 – Organisation Unit Lookup"
  type: http
  seq: 2

http:
  method: GET
  url: "{{kolada_base_url}}/ou/{{ou_id}}"
  params:
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: per_page
      value: "100"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: 10 – Municipality All KPIs by Year
  type: http
  seq: 4

http:
  method: GET
  url: "{{kolada_base_url}}/data/municipality/{{municipality_id}}/year/{{year}}?page=1&per_page=100"
  params:
    - name: from_date
      value: 2025-01-01
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

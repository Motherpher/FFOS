info:
  name: 09 – KPI All Municipalities by Year
  type: http
  seq: 3

http:
  method: GET
  url: "{{kolada_base_url}}/data/kpi/{{kpi_id}}/year/{{year}}?region_type=municipality"
  params:
    - name: from_date
      value: 2025-01-01
      type: query
      disabled: true
    - name: region_type
      value: municipality
      type: query
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: per_page
      value: "100"
      type: query
      disabled: true
    - name: year
      value: 2021-01-01
      type: query
      disabled: true
    - name: region_type
      value: region
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
